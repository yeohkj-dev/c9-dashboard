name: Keepalive

# GitHub pauses scheduled workflows after 60 days without repository activity.
# An empty commit every month counts as activity, so "Update dashboard" keeps running
# even if nobody touches the repo.

on:
  schedule:
    - cron: "0 3 1 * *"   # 1st of every month, 11am Malaysia
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "keepalive: $(date -u +%Y-%m-%d)"
          git push
